    <input type="checkbox" name="" id="open-login-box" />
    <input type="checkbox" name="" id="open-register-box" />

    <div id="login-box">
      <h2>Login</h2>
      <input type="email" name="" id="" placeholder="Email" />
      <input type="password" name="" id="" placeholder="Password" />
      <div id="remember-password">
        <div id="remember">
          <input type="checkbox" name="" id="checkbox-remember" />
          <label for="checkbox-remember">Remember me</label>
        </div>
        <p>Forgot Password?</p>
      </div>
      <button>Login</button>
      <label for="open-register-box"
        >Don't have an account? <b>Register</b></label
      >
    </div>

    <div id="register-box">
      <h2>Register</h2>
      <input type="text" name="" id="" placeholder="Name" />
      <input type="email" name="" id="" placeholder="Email" />
      <input type="password" name="" id="" placeholder="Password" />
      <input type="password" name="" id="" placeholder="Confirm Password" />
      <div id="accept-terms-box">
        <input type="checkbox" name="" id="accept-terms" />
        <label for="accept-terms">Accept the terms and conditions</label>
      </div>
      <button>Register</button>
      <p></p>
      <label for="open-login-box">Already have an account? <b>Login</b></label>
    </div>

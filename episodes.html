<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/02f360b709.js"
      crossorigin="anonymous"
    ></script>
    <link rel="icon" type="image/x-icon" href="img/layout/favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <title>Episodes</title>
  </head>
  <body class="backimg">
    <label for="open-menu"><i class="fa-solid fa-bars menu"></i></label>
    <input type="checkbox" name="" id="open-menu" />

    <label for="open-language"><h4 class="language">ENG</h4></label>
    <input type="checkbox" name="" id="open-language" />

    <label for="open-login"><h4 id="login">LOG IN</h4></label>
    <input type="checkbox" name="" id="open-login" />

    <div class="layout">
      <div class="lines">
        <div class="menu-content">
          <h1><a href="index.html">HOME</a></h1>
          <h1><a href="characters.html">CHARACTERS</a></h1>
          <h1><a href="gallery.html">GALLERY</a></h1>
          <h1><a href="episodes.html">EPISODES</a></h1>
          <h1><a href="store.html">STORE</a></h1>
        </div>
        <div class="normal-content">
          <h3>Select Seasson</h3>

          <div id="seasson-number">
            <i class="fa-solid fa-chevron-left"></i>
            <h2>II</h2>
            <i class="fa-solid fa-chevron-right"></i>
          </div>

          <h1>EPISODE 3</h1>

          <h3 id="seasson-episode">Select Episode</h3>
          <div id="episode-number">
            <i class="fa-solid fa-chevron-left"></i>
            <div id="select-episode">
              <hr class="hr-episode" />
              <h5>1</h5>
              <hr class="hr-episode" />
              <h5>2</h5>
              <hr class="hr-episode" />
              <h5 class="selected">3</h5>
              <hr class="hr-episode" />
              <h5>4</h5>
              <hr class="hr-episode" />
              <h5>5</h5>
              <hr class="hr-episode" />
              <h5>6</h5>
              <hr class="hr-episode" />
            </div>
            <i class="fa-solid fa-chevron-right"></i>
          </div>
        </div>
      </div>

      <div class="rubber"></div>
      <div class="rubber"></div>
      <div class="rubber"></div>
      <div class="rubber"></div>
      <div class="rubber invisible"></div>
      <div class="rubber"></div>
      <div class="rubber"></div>
      <div class="rubber"></div>
      <div class="rubber"></div>
      <div class="rubber"></div>
      <div class="rubber invisible"></div>
      <div class="rubber"></div>
      <div class="phone-line top"></div>
      <div class="phone-line bottom"></div>

      <img src="img/layout/logo.png" id="logo" alt="logo" />

      <h4 id="actual-page">EPISODES</h4>

      <nav>
        <a href="index.html"><h4>HOME</h4></a>
        <a href="characters.html"><h4>CHARACTERS</h4></a>

        <a href="gallery.html"><h4>GALLERY</h4></a>
        <a href="episodes.html"><h4 class="active">EPISODES</h4></a>
        <a href="store.html"><h4>STORE</h4></a>
      </nav>

      <div id="social-icons">
        <a href="https://www.youtube.com/@Netflix" target="_blank">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="https://twitter.com/ThePeakyBlinder" target="_blank">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a
          href="https://www.instagram.com/peakyblindersofficial/"
          target="_blank"
        >
          <i class="fa-brands fa-instagram"></i>
        </a>
      </div>

      <a id="scroll-down" href="episodes_info.html">
        <h6>EXPLORE EPISODE</h6>
        <img src="img/layout/seta.png" alt="" />
      </a>
    </div>

    <div id="change-language-box">
      <div id="change-language">
        <h4>PT</h4>
        <hr />
        <h4 id="actual-language">ENG</h4>
      </div>
      <div id="rotated-cube"></div>
      <div id="hide-half-cube"></div>
    </div>

    <input type="checkbox" name="" id="open-login-box" />
    <input type="checkbox" name="" id="open-register-box" />

    <div id="login-box">
      <h2>Login</h2>
      <input type="email" name="" id="" placeholder="Email" />
      <input type="password" name="" id="" placeholder="Password" />
      <div id="remember-password">
        <div id="remember">
          <input type="checkbox" name="" id="checkbox-remember" />
          <label for="checkbox-remember">Remember me</label>
        </div>
        <p>Forgot Password?</p>
      </div>
      <button>Login</button>
      <label for="open-register-box"
        >Don't have an account? <b>Register</b></label
      >
    </div>

    <div id="register-box">
      <h2>Register</h2>
      <input type="text" name="" id="" placeholder="Name" />
      <input type="email" name="" id="" placeholder="Email" />
      <input type="password" name="" id="" placeholder="Password" />
      <input type="password" name="" id="" placeholder="Confirm Password" />
      <div id="accept-terms-box">
        <input type="checkbox" name="" id="accept-terms" />
        <label for="accept-terms">Accept the terms and conditions</label>
      </div>
      <button>Register</button>
      <p></p>
      <label for="open-login-box">Already have an account? <b>Login</b></label>
    </div>
  </body>
</html>
